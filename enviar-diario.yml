name: Enviar porção diária

on:
  schedule:
    # 09:00 UTC = 06:00 em America/Fortaleza (UTC-3, sem horário de verão).
    # Ajuste o horário trocando o valor abaixo, sempre em UTC.
    - cron: '0 9 * * *'
  workflow_dispatch: {}  # permite rodar manualmente pela aba Actions, útil para testar

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r scripts/requirements.txt

      - name: Rodar script de envio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NOME: "Porção Diária"
        - name: Rodar script de envio (debug)
  run: |
    set -e
    python -u scripts/enviar_email.py
