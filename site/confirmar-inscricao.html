<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Confirmar inscrição — Porção Diária</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --papel: #EDE4D0;
    --papel-escuro: #E2D6BC;
    --tinta: #2B2620;
    --tinta-suave: #5B5347;
    --vinho: #7A1F2B;
    --vinho-escuro: #5E1620;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--papel);
    color:var(--tinta);
    font-family:"Source Serif 4", Georgia, serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .cartao{
    max-width:480px;
    width:100%;
    background:var(--papel-escuro);
    border-radius:2px;
    padding:48px 40px;
    box-shadow: 0 1px 2px rgba(43,38,32,0.08), 0 24px 48px -24px rgba(43,38,32,0.35);
    text-align:center;
  }
  .eyebrow{
    font-family:"Source Serif 4", serif;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--vinho);
    margin:0 0 12px;
  }
  h1{
    font-family:"Fraunces", serif;
    font-weight:600;
    font-size:26px;
    line-height:1.2;
    margin:0 0 16px;
  }
  p{
    font-size:16px;
    line-height:1.6;
    color:var(--tinta-suave);
    margin:0 0 28px;
  }
  button{
    font-family:"Source Serif 4", serif;
    font-size:16px;
    font-weight:600;
    padding:13px 22px;
    border:none;
    border-radius:2px;
    background:var(--vinho);
    color:var(--papel);
    cursor:pointer;
  }
  button:hover{ background:var(--vinho-escuro); }
  button:disabled{ opacity:0.6; cursor:default; }
</style>
</head>
<body>
  <main class="cartao" id="cartao">
    <p class="eyebrow">Confirmação de cadastro</p>
    <h1 id="titulo">Confirmar sua inscrição?</h1>
    <p id="texto">
      Só depois dessa confirmação você passa a receber a porção
      bíblica diária. Se você não pediu essa inscrição, é só ignorar
      esta página: o cadastro é removido automaticamente em alguns
      dias sem confirmação.
    </p>
    <button id="botao-confirmar" type="button">Confirmar inscrição</button>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // Mesmos valores usados em index.html, cancelar.html e confirmar.html.
    const SUPABASE_URL = "COLOQUE_A_URL_DO_SEU_PROJETO_SUPABASE";
    const SUPABASE_ANON_KEY = "COLOQUE_A_ANON_KEY_DO_SEU_PROJETO_SUPABASE";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const titulo = document.getElementById('titulo');
    const texto = document.getElementById('texto');
    const botao = document.getElementById('botao-confirmar');

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      titulo.textContent = 'Link inválido.';
      texto.textContent = 'Faltam informações no link para confirmar o cadastro.';
      botao.remove();
    } else {
      botao.addEventListener('click', async () => {
        botao.disabled = true;
        botao.textContent = 'Confirmando...';

        const { error } = await supabase.rpc('confirmar_cadastro', { token_informado: token });

        if (error) {
          texto.textContent = 'Não foi possível confirmar agora. Tente de novo em instantes.';
          botao.disabled = false;
          botao.textContent = 'Confirmar inscrição';
          return;
        }

        titulo.textContent = 'Inscrição confirmada!';
        texto.textContent = 'A partir de amanhã você começa a receber a porção bíblica diária.';
        botao.remove();
      });
    }
  </script>
</body>
</html>
